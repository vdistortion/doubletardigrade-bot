name: Deploy Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/doubletardigrade-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:release
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_PAT,GHCR_USER,REPO_URL,GROUP_TOKEN,USER_TOKEN,SUPER_ADMINS,POSTGRES_PASSWORD
          script: |
            set -e
            PROJECT_PATH=~/projects/doubletardigrade-bot
            if [ ! -d "$PROJECT_PATH" ]; then
              mkdir -p ~/projects
              git clone -b release "$REPO_URL" "$PROJECT_PATH"
            fi
            cd "$PROJECT_PATH"

            mkdir -p ./data/release_db
            git fetch origin release
            git reset --hard origin/release

            echo "GROUP_TOKEN=${GROUP_TOKEN}" > .env.release
            echo "USER_TOKEN=${USER_TOKEN}" >> .env.release
            echo "SUPER_ADMINS=${SUPER_ADMINS}" >> .env.release
            echo "POSTGRES_DB=postgres" >> .env.release
            echo "POSTGRES_USER=postgres" >> .env.release
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env.release
            echo "POSTGRES_HOST=db" >> .env.release
            chmod 600 .env.release

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f compose.release.yaml pull
            docker compose -f compose.release.yaml up -d
            docker image prune -f
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
          REPO_URL: https://${{ github.actor }}:${{ secrets.GHCR_PAT }}@github.com/${{ github.repository }}.git
          GROUP_TOKEN: ${{ secrets.GROUP_TOKEN }}
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          SUPER_ADMINS: ${{ secrets.SUPER_ADMINS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
